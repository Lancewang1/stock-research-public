name: Update macro news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-macro-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public headline feed
        run: python scripts/update_macro_news.py
      - name: Commit changed feed
        run: |
          if git diff --quiet -- reports/2026-09-10/freeride-macro-intelligence/news-feed.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/2026-09-10/freeride-macro-intelligence/news-feed.json
          git commit -m "data: refresh macro news feed"
          git push
